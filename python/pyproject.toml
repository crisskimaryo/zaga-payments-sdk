[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zaga-payments"
version = "0.1.0"
description = "Client for the Zaga Payments gateway (charges, status polling, refunds, webhook verification). Standard library only."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]

[project.urls]
Homepage = "https://github.com/crisskimaryo/zaga-payments-sdk"

[tool.setuptools]
py-modules = ["zaga_payments"]
