name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.4' }
      - run: bun install
      - run: bun run typecheck
      - run: bun test
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: cd dart && dart pub get && dart analyze && dart test
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m py_compile python/zaga_payments.py
      - run: pip install ./python pytest && cd python && python -m pytest -q tests
